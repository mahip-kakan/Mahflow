name: Windows installer

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-id: ${{ steps.id.outputs.release-id }}
    steps:
      - name: Use the existing v0.2.2 release
        id: id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases/tags/v0.2.2" --jq .id)
          echo "release-id=$id" >> "$GITHUB_OUTPUT"
          echo "Uploading the Windows installer to release $id"

  windows:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      sign-binaries: false
      asset-prefix: mahflow
      upload-artifacts: true
      release-id: ${{ needs.release.outputs.release-id }}
